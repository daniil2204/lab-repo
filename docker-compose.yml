version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://flightdb.cn8owku0y7or.eu-north-1.rds.amazonaws.com:5432/flightdb
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
