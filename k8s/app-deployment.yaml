apiVersion: apps/v1
kind: Deployment
metadata:
  name: flightapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flightapp
  template:
    metadata:
      labels:
        app: flightapp
    spec:
      containers:
        - name: flightapp
          image: flightapp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://flightdb.cn8owku0y7or.eu-north-1.rds.amazonaws.com:5432/flightdb
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.timezone=UTC
---
apiVersion: v1
kind: Service
metadata:
  name: flightapp
spec:
  type: NodePort
  selector:
    app: flightapp
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
