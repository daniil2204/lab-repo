spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://flightdb.cn8owku0y7or.eu-north-1.rds.amazonaws.com:5432/flightdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

logging:
  level:
    org.springframework.security: DEBUG
